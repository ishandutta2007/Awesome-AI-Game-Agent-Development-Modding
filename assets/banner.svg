<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      
      /* Dynamic Ambient Pulse Animations */
      @keyframes pulseGlow1 {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.6; }
        50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.9; }
      }
      @keyframes pulseGlow2 {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.5; }
        50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.8; }
      }
      @keyframes streamMotion {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.2); }
      }

      .glow-orb-1 {
        animation: pulseGlow1 9s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow2 11s ease-in-out infinite;
        transform-origin: 1000px 300px;
      }
      .data-stream {
        stroke-dasharray: 20, 15;
        animation: streamMotion 12s linear infinite;
      }
      .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 5.5s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 4.8s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Glowing Orbs (in background) -->
  <circle class="glow-orb-1" cx="180" cy="90" r="190" fill="url(#glowGrad1)" />
  <circle class="glow-orb-2" cx="1020" cy="310" r="230" fill="url(#glowGrad2)" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Flowing Dynamic Cyber Streams (in background) -->
  <path class="data-stream" d="M -50,330 C 250,220 400,380 750,280 C 950,210 1100,290 1250,230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" />
  <path class="data-stream" d="M -50,110 C 300,180 500,60 850,150 C 1050,200 1150,110 1250,140" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.25" />

  <!-- Floating Ambient Sparkles -->
  <circle class="particle-1" cx="160" cy="270" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle class="particle-2" cx="1060" cy="130" r="3.5" fill="#c084fc" filter="url(#glow)" />
  <circle class="particle-3" cx="620" cy="70" r="2.5" fill="#818cf8" filter="url(#glow)" />
  <circle class="particle-1" cx="890" cy="360" r="2.5" fill="#38bdf8" />

  <!-- Foreground Content Container (Ensures title & text stay perfectly visible and unobstructed) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="32" y="21" class="tag-text" fill="#38bdf8">EMBODIED GAME AI &amp; MODDING</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="85" class="title-text" fill="url(#accentGrad)" filter="url(#cardShadow)">
      Awesome AI Game Agent Development
    </text>

    <!-- Subtitle and Scope -->
    <text x="0" y="125" class="subtitle-text">
      Curated ecosystem of Autonomous Agents, Mineflayer Bots, LLM Runtimes &amp; High-Throughput Engines
    </text>

    <!-- Feature Showcase Pills -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: Mineflayer & Voyager -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect width="245" height="48" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="14" y="14" width="20" height="20" rx="6" fill="#38bdf8" fill-opacity="0.2" />
        <text x="24" y="28" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#38bdf8">🤖</text>
        <text x="46" y="30" class="tag-text">Voyager &amp; Mineflayer</text>
      </g>

      <!-- Pill 2: High-Performance Servers -->
      <g transform="translate(260, 0)" filter="url(#cardShadow)">
        <rect width="250" height="48" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="14" y="14" width="20" height="20" rx="6" fill="#818cf8" fill-opacity="0.2" />
        <text x="24" y="28" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#818cf8">⚡</text>
        <text x="46" y="30" class="tag-text">PaperMC &amp; Folia Engine</text>
      </g>

      <!-- Pill 3: Modding Frameworks -->
      <g transform="translate(525, 0)" filter="url(#cardShadow)">
        <rect width="240" height="48" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="14" y="14" width="20" height="20" rx="6" fill="#c084fc" fill-opacity="0.2" />
        <text x="24" y="28" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#c084fc">🎮</text>
        <text x="46" y="30" class="tag-text">FabricMC &amp; NeoForge</text>
      </g>

      <!-- Pill 4: RL & Simulation -->
      <g transform="translate(780, 0)" filter="url(#cardShadow)">
        <rect width="260" height="48" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" />
        <rect x="14" y="14" width="20" height="20" rx="6" fill="#34d399" fill-opacity="0.2" />
        <text x="24" y="28" font-size="12" font-family="sans-serif" text-anchor="middle" fill="#34d399">🧠</text>
        <text x="46" y="30" class="tag-text">Gymnasium &amp; ML-Agents</text>
      </g>
    </g>

    <!-- Bottom Metrics Bar -->
    <g transform="translate(0, 235)">
      <text x="0" y="0" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">
        ECOSYSTEM: <tspan fill="#38bdf8">30+ Curated Tools</tspan> • <tspan fill="#818cf8">LLM Autonomous Bots</tspan> • <tspan fill="#c084fc">SaaS &amp; Open-Source</tspan> • <tspan fill="#e2e8f0">Continuously Updated</tspan>
      </text>
    </g>
  </g>

  <!-- Sleek Framing Border -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
